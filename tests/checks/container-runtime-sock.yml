---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dont-fire
spec:
  template:
    spec:
      containers:
        - name: app
          volumeMounts:
            - name: thingsock
              mountPath: "/var/run/thing.sock"
      volumes:
        - name: thingsock
          hostPath:
            path: /var/run/thing.sock
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: dont-fire
spec:
  template:
    spec:
      containers:
        - name: app
          volumeMounts:
            - name: thingsock
              mountPath: "/var/run/thing.sock"
      volumes:
        - name: thingsock
          hostPath:
            path: /var/run/thing.sock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appdocker
spec:
  template:
    spec:
      containers:
      - name: appdocker
        volumeMounts:
        - name: dockersock
          mountPath: "/var/run/docker.sock"
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appcontainerd
spec:
  template:
    spec:
      containers:
      - name: appcontainerd
        volumeMounts:
        - name: containerdsock
          mountPath: "/var/run/containerd.sock"
      volumes:
      - name: containerdsock
        hostPath:
          path: /var/run/containerd.sock
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: appcrio
spec:
  selector:
    matchLabels:
      app: appcrio
  serviceName: "appcrio"
  template:
    metadata:
      labels:
        app: appcrio
    spec:
      containers:
      - name: appcrio
        volumeMounts:
        - name: criosock
          mountPath: "/var/run/crio.sock"
      volumes:
      - name: criosock
        hostPath:
          path: /var/run/crio.sock
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: app
spec:
  template:
    spec:
      containers:
      - name: app
        volumeMounts:
        - name: dockersock
          mountPath: "/var/run/docker.sock"
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
